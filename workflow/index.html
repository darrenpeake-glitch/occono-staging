<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#064E3B">
  <title>Occono Workflow</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./workflow.css">
  <link rel="stylesheet" href="./actions.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="/" aria-label="Occono home">
      <img src="./assets/occono-lockup.svg" alt="Occono Web Studio">
    </a>
    <div class="header-actions">
      <span id="userBadge" class="user-badge"></span>
      <button id="logoutButton" class="button button-secondary" type="button">Sign out</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="page-heading">
      <div>
        <p class="eyebrow">Staff workflow</p>
        <h1 id="pageTitle">All current work</h1>
        <p id="pageSummary">Live operational view across Occono workflows.</p>
      </div>
      <div class="view-actions">
        <label>
          <span>Workflow</span>
          <select id="workflowFilter"></select>
        </label>
        <label id="ownerFilterWrap">
          <span>Assigned to</span>
          <select id="ownerFilter"></select>
        </label>
      </div>
    </section>

    <section id="metrics" class="metrics" aria-label="Workflow summary"></section>
    <nav id="attentionFilters" class="attention-filters" aria-label="Attention filters">
      <button type="button" class="attention-filter is-active" data-attention="all">All work</button>
      <button type="button" class="attention-filter" data-attention="exceptions">Needs attention</button>
      <button type="button" class="attention-filter" data-attention="overdue">Overdue</button>
      <button type="button" class="attention-filter" data-attention="today">Due today</button>
    </nav>
    <section id="board" class="board" aria-label="Kanban board"></section>
  </main>

  <dialog id="cardDialog" class="card-dialog">
    <div class="dialog-shell">
      <button id="dialogCloseButton" class="dialog-close" type="button" aria-label="Close">×</button>
      <div id="cardDetails"></div>
    </div>
  </dialog>

  <script type="module" src="./workflow.js"></script>
</body>
</html>
