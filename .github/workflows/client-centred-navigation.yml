name: Update client-centred navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-centred-navigation.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update navigation and calls to action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<a href="#work">Work</a>': '<a href="#work">Our work</a>',
              '<a href="#approach">Approach</a>': '<a href="#approach">How we work</a>',
              '<a href="#pricing">Pricing</a>': '<a href="#pricing">Guide pricing</a>',
              '<a class="button button-small" href="#contact">Start a project</a>': '<a class="button button-small" href="#contact">Tell us about your website</a>',
              '<a class="text-link" href="#contact">Discuss a project <span>→</span></a>': '<a class="text-link" href="#contact">Discuss your website <span>→</span></a>',
              '<a href="#contact">Start a project →</a>': '<a href="#contact">Tell us about your website →</a>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "Occono site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make navigation and CTAs client-centred"
          git push
