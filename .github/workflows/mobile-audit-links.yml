name: Add shared mobile audit stylesheet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-audit-links.yml'

permissions:
  contents: write

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add stylesheet links to concept sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('marine/index.html'), Path('garage/index.html'), Path('stays/index.html'),
              Path('restaurant/index.html'), Path('builder/index.html'), Path('shop/index.html')
          ]
          link = '<link href="../assets/mobile-audit.css" rel="stylesheet"/>'
          for path in files:
              text = path.read_text(encoding='utf-8')
              if link not in text:
                  text = text.replace('</head>', link + '</head>')
                  path.write_text(text, encoding='utf-8')
          PY
      - name: Commit mobile links
        run: |
          git config user.name "Occono site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add marine/index.html garage/index.html stays/index.html restaurant/index.html builder/index.html shop/index.html
          git commit -m "Apply mobile QA stylesheet to concept sites"
          git push
