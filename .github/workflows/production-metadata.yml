name: Switch site to production metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-metadata.yml'

permissions:
  contents: write

jobs:
  update-production-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update production URLs and indexing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('https://darrenpeake-glitch.github.io/occono-staging/', 'https://www.occono.co.uk/')
          text = text.replace('<meta content="noindex, nofollow" name="robots"/>', '<meta content="index, follow" name="robots"/>')
          index.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sitemap_text = sitemap.read_text(encoding='utf-8').replace('https://darrenpeake-glitch.github.io/occono-staging/', 'https://www.occono.co.uk/')
          sitemap.write_text(sitemap_text, encoding='utf-8')

          robots = Path('robots.txt')
          robots.write_text('User-agent: *\nAllow: /\n\nSitemap: https://www.occono.co.uk/sitemap.xml\n', encoding='utf-8')
          PY
      - name: Commit production metadata
        run: |
          git config user.name "Occono site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt
          git commit -m "Switch site metadata to production domain"
          git push
