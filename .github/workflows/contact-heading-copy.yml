name: Update contact heading copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contact-heading-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update contact heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Tell us what the website needs to do.'
          new = 'Tell us what your website needs to do.'
          if old not in text:
              raise SystemExit('Expected heading not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "Occono site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make contact heading client-focused"
          git push
