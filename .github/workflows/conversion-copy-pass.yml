name: Refine conversion copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conversion-copy-pass.yml'

permissions:
  contents: write

jobs:
  refine-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine calls to action and enquiry reassurance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<a class="button ghost" href="#contact">Discuss this build</a>': '<a class="button ghost" href="#contact">Tell us about your website</a>',
              '<a class="button" href="#contact">Start a conversation</a>': '<a class="button" href="#contact">Tell us about your website</a>',
              '<a class="button ghost" href="#contact">Describe the project</a>': '<a class="button ghost" href="#contact">Tell us about your website</a>',
              '<select id="type" name="type"><option>New business website</option><option>Replace an existing website</option><option>Online shop</option><option>Booking or enquiry website</option><option>Not sure yet</option></select>': '<select id="type" name="type"><option>Not sure yet</option><option>New business website</option><option>Replace an existing website</option><option>Online shop</option><option>Booking or enquiry website</option></select>',
              '<div class="contact-prompt"><b>Not ready for a full brief?</b><span>That is fine. A rough description is enough to start.</span></div>': '<div class="contact-prompt"><b>A rough outline is enough.</b><span>No automatic sales call. We read your message first and reply personally.</span></div>',
              '<button class="button" type="submit">Send project outline</button>': '<button class="button" type="submit">Send website outline</button>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit conversion refinements
        run: |
          git config user.name "Occono site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine enquiry journey and conversion copy"
          git push
